<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚡ Taller de Energía — Chispa te enseña</title>
<style>
:root{
  --dark:#2b2d42; --yellow:#ffd166; --pink:#ef476f;
  --green:#06d6a0; --blue:#118ab2; --orange:#f4a261;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:0;min-height:100vh;
  font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS',system-ui,sans-serif;
  color:var(--dark);
  background:
    radial-gradient(circle at 8% 0%, #d9f7ff 0%, transparent 50%),
    radial-gradient(circle at 92% 8%, #fff3d6 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, #ffe6f0 0%, transparent 55%),
    #f7fbff;
}
.app{max-width:880px;margin:0 auto;padding:0 14px 40px}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:10px 4px;margin-bottom:8px;
  background:rgba(247,251,255,.88);backdrop-filter:blur(6px);
}
.icon-btn{
  border:3px solid var(--dark);background:#fff;border-radius:14px;
  font-size:1.1rem;width:44px;height:44px;cursor:pointer;
  box-shadow:0 3px 0 var(--dark);transition:.12s;font-family:inherit;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--dark)}
.brand{font-weight:bold;font-size:1.15rem;flex:1}
.stars{
  background:#fff;border:3px solid var(--dark);border-radius:16px;
  padding:6px 12px;font-weight:bold;box-shadow:0 3px 0 var(--dark);
  font-size:1rem;white-space:nowrap;
}

h1{font-size:1.9rem;text-align:center;margin:10px 0 4px;line-height:1.15}
.lead{text-align:center;font-size:1rem;margin:6px auto 18px;max-width:600px;color:#4a4e69}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{
  display:flex;align-items:center;gap:14px;text-align:left;
  background:#fff;border:4px solid var(--dark);border-radius:22px;
  padding:14px;cursor:pointer;font-family:inherit;color:var(--dark);
  box-shadow:0 5px 0 var(--dark);transition:.14s;width:100%;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--dark)}
.card:active{transform:translateY(2px);box-shadow:0 3px 0 var(--dark)}
.card .emoji{
  width:58px;height:58px;flex:0 0 58px;border-radius:18px;
  display:grid;place-items:center;font-size:1.9rem;border:3px solid var(--dark);
}
.card h3{margin:0 0 4px;font-size:1.02rem;line-height:1.2}
.card p{margin:0;font-size:.8rem;color:#5c6070}
.mini-bar{height:9px;background:#e9eef5;border-radius:9px;margin-top:8px;overflow:hidden;border:2px solid #dfe6ef}
.mini-fill{height:100%;border-radius:9px;transition:width .4s}
.total{text-align:center;margin-top:22px;font-size:.95rem;color:#4a4e69}
.reset{
  display:block;margin:16px auto 0;background:none;border:none;
  color:#8d93a5;font-size:.82rem;text-decoration:underline;cursor:pointer;font-family:inherit;
}

.panel{
  background:#fff;border:4px solid var(--dark);border-radius:26px;
  padding:22px 18px;box-shadow:0 6px 0 var(--dark);text-align:center;
  animation:pop .3s ease-out;
}
.badge{
  width:84px;height:84px;margin:0 auto 10px;border-radius:26px;
  display:grid;place-items:center;font-size:2.6rem;border:4px solid var(--dark);
}
.panel h2{margin:6px 0;font-size:1.3rem}
.fact{
  background:#fff9e6;border:3px dashed var(--orange);border-radius:16px;
  padding:12px;font-size:.92rem;text-align:left;margin:14px 0;line-height:1.4;
}
.big-btn{
  display:inline-block;border:4px solid var(--dark);border-radius:18px;
  background:var(--green);color:#fff;font-family:inherit;font-weight:bold;
  font-size:1.05rem;padding:13px 26px;cursor:pointer;
  box-shadow:0 5px 0 var(--dark);transition:.14s;margin-top:8px;
}
.big-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--dark)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--dark)}
.big-btn.alt{background:var(--blue)}
.link-btn{
  display:block;margin:14px auto 0;background:none;border:none;
  color:#7b8194;text-decoration:underline;cursor:pointer;font-family:inherit;font-size:.9rem;
}

.mhead{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.pill{
  border:3px solid var(--dark);border-radius:14px;padding:5px 12px;
  font-size:.82rem;font-weight:bold;box-shadow:0 3px 0 var(--dark);
}
.pill.light{background:#fff}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:0 0 14px}
.dot{width:12px;height:12px;border-radius:50%;background:#dde4ee;border:2px solid #cfd8e6}
.dot.done{background:var(--green);border-color:#049e78}
.dot.now{background:var(--yellow);border-color:var(--orange);transform:scale(1.3)}

.art-box{
  background:linear-gradient(180deg,#f2fbff,#eaf6ff);
  border:3px solid var(--dark);border-radius:22px;
  padding:8px;display:grid;place-items:center;margin-bottom:14px;
  box-shadow:0 4px 0 rgba(43,45,66,.18);
}
svg.art{width:100%;max-width:340px;height:auto;display:block}

.qtext{font-size:1.12rem;line-height:1.35;margin:0 0 14px;text-align:center}
.opts{display:grid;gap:11px}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:#fff;border:3px solid var(--dark);border-radius:18px;
  padding:13px 15px;font-size:.98rem;font-family:inherit;color:var(--dark);
  cursor:pointer;box-shadow:0 4px 0 var(--dark);transition:.13s;line-height:1.3;
}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--dark);background:#f6fcff}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--dark)}
.opt .letter{
  flex:0 0 30px;width:30px;height:30px;border-radius:50%;
  background:var(--yellow);border:3px solid var(--dark);
  display:grid;place-items:center;font-weight:bold;font-size:.9rem;
}
.opt.correct{background:#d8f8ec;border-color:#059e78;box-shadow:0 4px 0 #059e78}
.opt.correct .letter{background:var(--green)}
.opt.wrong{background:#ffe3e9;border-color:var(--pink);box-shadow:0 4px 0 var(--pink);animation:shake .4s}
.opt.wrong .letter{background:var(--pink)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

.fb{margin-top:16px;border-radius:20px;padding:14px;border:3px solid var(--dark);animation:pop .25s}
.fb.ok{background:#e3fbf1;border-color:#059e78}
.fb.no{background:#fff0f3;border-color:var(--pink)}
.fb-text{font-size:.95rem;line-height:1.45}
.fb .big-btn{margin-top:14px}

@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
}
.pop-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.pop-layer span{position:absolute;bottom:12%;font-size:2rem;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{
  0%{transform:translateY(0) scale(.6);opacity:1}
  100%{transform:translateY(-70vh) scale(1.25) rotate(20deg);opacity:0}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="btnHome" title="Volver al inicio">🏠</button>
    <div class="brand">⚡ Taller de Energía</div>
    <div class="stars"><span id="starCount">0</span> ⭐</div>
  </header>

        "Una marca que deja el zapato en el piso de la casa cuando caminamos",
        "Un tipo de zapato para caminar por la montaña y por la ciudad",
        "La contaminación que dejan nuestras actividades"

      fb:"¡Muy bien! Cada kilovatio que gastamos deja una pequeña marca en el planeta." },
    { art:"checklist", q:"La etiqueta 'Clase A' en un aparato significa que...", correct:1,
      options:[
        "Es muy ruidoso y molesta a los vecinos",
        "Gasta poca energía y es eficiente",
        "Es de color azul, bonito y muy llamativo para los niños"
      ],
      fb:"¡Correcto! La clase A es la más eficiente de todas." },
    { art:"fantasma", q:"Dejar el cargador enchufado sin el celular es...", correct:0,
      options:[
        "Consumo fantasma que gasta energía",
        "Una buena idea para tenerlo listo siempre",
        "Algo totalmente gratis y sin costo"
      ],
      fb:"¡Muy bien! El cargador sigue 'trabajando' aunque no cargue nada." },
    { art:"mundo", q:"¿Para qué ahorramos energía?", correct:2,
      options:[
        "Solo para tener más dinero en el bolsillo y comprar más aparatos",
        "Para que la casa quede oscura y triste, sin ninguna luz encendida",
        "Para cuidar el planeta y que todos tengan luz"
      ],
      fb:"¡Exacto! Ahorrar energía es un acto de solidaridad con el planeta." },
    { art:"casa", q:"Usar la luz del sol de día en vez del bombillo es...", correct:1,
      options:[
        "Un desperdicio de energía y de dinero",
        "Una práctica eficiente y ecológica",
        "Un peligro para la salud de las personas que viven en la casa"
      ],
      fb:"¡Muy bien! La luz natural es gratis y no contamina." },
    { art:"fantasma", q:"Dejar la tele en 'standby' toda la noche es...", correct:0,
      options:[
        "Un derroche de energía sin darnos cuenta",
        "Un ahorro de energía muy importante para toda la familia y el planeta",
        "Algo necesario para que el aparato funcione correctamente siempre"
      ],
      fb:"¡Correcto! El modo espera puede llegar al 10% de la factura." },
    { art:"rayo", q:"Botar las pilas usadas a la basura común es...", correct:2,
      options:[
        "Correcto, porque así se hace siempre en todas las casas y escuelas",

      ],
      fb:"¡Exacto! Las pilas tienen químicos que contaminan suelo y agua." },
    { art:"mundo", q:"El nivel más alto de ciudadanía energética es...", correct:1,
      options:[
        "Consumidor ciego, que no sabe nada de energía y desperdicia todo",

        "Ahorrador reactivo, que solo mira la factura"
      ],
      fb:"¡Muy bien! El defensor cuida la energía en su vida, su casa y su profesión." },
    { art:"casa", q:"¿Cuál es un acto de ciudadanía energética?", correct:0,
      options:[
        "Apagar y desconectar lo que no usas",

        "Usar el celular mientras duermes y dejarlo cargando toda la noche"
      ],
      fb:"¡Correcto! Pequeños actos repetidos todos los días cambian el mundo." },
    { art:"rayo", q:"La energía no se crea ni se destruye, solo se...", correct:2,
      options:[
        "Pierde para siempre en el aire y ya no se puede volver a usar",

        "Transforma en otra forma de energía"
      ],
      fb:"¡Exacto! Es la ley más importante de la energía." },

      options:[
        "Comprar más aparatos eléctricos para la casa",
        "Cambiar los bombillos por LED y desconectar",

/* =========================================================
   3. ESTADO Y UTILIDADES
   ========================================================= */
const KEY = 'tallerEnergia_v1';
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ done = {}; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }
function countDone(){ return Object.keys(done).filter(k => done[k]).length; }
function moduleCount(mi){
  return MODULES[mi].missions.filter((_,qi) => done[mi+'-'+qi]).length;
}
function updateStars(){
  const el = document.getElementById('starCount');
  if(el) el.textContent = countDone();
}
function popStars(){
  const cont = document.createElement('div');
  cont.className = 'pop-layer';
  for(let i=0;i<9;i++){
    const s = document.createElement('span');
    s.textContent = Math.random() < .5 ? '⭐' : '✨';
    s.style.left = (12 + Math.random()*76) + '%';
    s.style.animationDelay = (Math.random()*0.35) + 's';
    cont.appendChild(s);
  }
  document.body.appendChild(cont);
  setTimeout(()=>cont.remove(), 1800);
}

const screen = document.getElementById('screen');

/* =========================================================
   4. PANTALLAS
   ========================================================= */
function renderHome(){
  const total = MODULES.reduce((a,m)=>a+m.missions.length,0);
  screen.innerHTML = `
    <h1>⚡ Taller de Energía ⚡</h1>
    <p class="lead">¡Hola! Soy <b>Chispa</b> 🔆 y te voy a acompañar a descubrir cómo viaja la energía,
    cómo mantenerte seguro y cómo cuidar el planeta. Elige un módulo y empieza la aventura.</p>
    <div class="cards">
      ${MODULES.map((m,i)=>{
        const c = moduleCount(i);
        const t = m.missions.length;
        const pct = Math.round(c/t*100);
        return `<button class="card" data-m="${i}">
          <div class="emoji" style="background:${m.color}">${m.emoji}</div>
          <div style="flex:1">
            <h3>Misión ${i+1} · ${m.title}</h3>
            <p>${m.subtitle}</p>
            <div class="mini-bar"><div class="mini-fill" style="width:${pct}%;background:${m.color}"></div></div>
            <p style="margin-top:5px;font-weight:bold;color:${m.color}">
              ${c}/${t} ${c===t?'· ¡Completado! 🏅':''}
            </p>
          </div>
        </button>`;
      }).join('')}
    </div>
    <div class="total">⭐ Misiones completadas: <b>${countDone()}</b> de ${total}</div>
    <button class="reset" id="reset">Borrar mi progreso y empezar de nuevo</button>
  `;
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> renderIntro(+c.dataset.m));
  });
  document.getElementById('reset').addEventListener('click', ()=>{
    if(confirm('¿Seguro que quieres borrar todo tu progreso?')){
      done = {}; save(); updateStars(); renderHome();
    }
  });
  updateStars();
}

function renderIntro(mi){
  const m = MODULES[mi];
  const c = moduleCount(mi), t = m.missions.length;
  screen.innerHTML = `
    <div class="panel">
      <div class="badge" style="background:${m.color}">${m.emoji}</div>
      <h2>Misión ${mi+1}: ${m.title}</h2>
      <p class="lead" style="margin-bottom:0">${m.subtitle}</p>
      <div class="art-box" style="margin-top:14px">${ART[m.art]()}</div>
      <p class="fact">💡 <b>¿Sabías que...?</b><br>${m.fact}</p>
      <p style="font-size:.9rem;color:#5c6070">Ya completaste <b>${c}</b> de <b>${t}</b> misiones de este módulo.</p>
      <button class="big-btn" id="start">${c===0?'¡Empezar las 15 misiones!':'Continuar'}</button>
      <button class="link-btn" id="back">← Volver al inicio</button>
    </div>`;
  document.getElementById('start').addEventListener('click', ()=>{
    let next = 0;
    while(next < m.missions.length && done[mi+'-'+next]) next++;
    if(next >= m.missions.length) next = 0;
    renderMission(mi, next);
  });
  document.getElementById('back').addEventListener('click', renderHome);
  updateStars();
}

let locked = false;
function renderMission(mi, qi){
  locked = false;
  const m = MODULES[mi];
  const q = m.missions[qi];
  const correct = q.correct;

  screen.innerHTML = `
    <div class="mhead">
      <span class="pill" style="background:${m.color}">${m.emoji} Módulo ${mi+1}</span>
      <span class="pill light">Misión ${qi+1} de ${m.missions.length}</span>
    </div>
    <div class="dots">
      ${m.missions.map((_,i)=>`<span class="dot ${done[mi+'-'+i]?'done':''} ${i===qi?'now':''}"></span>`).join('')}
    </div>
    <div class="art-box">${ART[q.art]()}</div>
    <h3 class="qtext">${q.q}</h3>
    <div class="opts" id="opts">
      ${q.options.map((opt,pos)=>`
        <button class="opt" data-oi="${pos}">
          <span class="letter">${'ABC'[pos]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    <div id="feedback"></div>
  `;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(locked) return;
      const oi = +btn.dataset.oi;
      if(oi === correct){
        locked = true;
        btn.classList.add('correct');
        document.querySelectorAll('.opt').forEach(b=>{
          if(+b.dataset.oi !== correct) b.classList.add('dim');
        });
        done[mi+'-'+qi] = true;
        save(); updateStars(); popStars();
        showFeedback(true, q.fb, mi, qi);
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        showFeedback(false, '¡Casi! No es esa. Respira, mira el dibujo y vuelve a intentarlo. 🤔', mi, qi);
      }
    });
  });

  updateStars();
}

function showFeedback(ok, text, mi, qi){
  const m = MODULES[mi];
  const isLast = qi === m.missions.length - 1;
  const box = document.getElementById('feedback');
  if(!box) return;
  box.innerHTML = `
    <div class="fb ${ok?'ok':'no'}">
      <div class="fb-text">${ok?'✅ ¡Muy bien! ':'💡 '}${text}</div>
      ${ok ? `<button class="big-btn" id="next">${isLast?'🏁 Terminar el módulo':'Siguiente ➡'}</button>` : ''}
    </div>`;
  if(ok){
    document.getElementById('next').addEventListener('click', ()=>{
      if(isLast) renderEnd(mi);
      else renderMission(mi, qi+1);
    });
  }
}

function renderEnd(mi){
  const m = MODULES[mi];
  const hasNext = mi < MODULES.length - 1;
  screen.innerHTML = `
    <div class="panel">
      <div class="badge" style="background:${m.color};font-size:3.2rem">🏅</div>
      <h2>¡Módulo ${mi+1} completado!</h2>
      <p class="lead">Terminaste las ${m.missions.length} misiones de <b>${m.title}</b>.<br>
      ¡Chispa está muy orgullosa de ti! ⚡</p>
      <div class="art-box">${ART[m.art]()}</div>
      <p class="fact">🌟 <b>Tu medalla:</b> ${mi===0?'Constructor de Circuitos':mi===1?'Guardián de la Seguridad':mi===2?'Explorador Energético':'Ciudadano Energético'}</p>
      ${hasNext ? `<button class="big-btn alt" id="nextMod">Ir al Módulo ${mi+2} ➡</button>` : ''}
      <button class="big-btn" id="again" style="background:#8d93a5">Repetir este módulo</button>
      <button class="link-btn" id="home">← Volver al inicio</button>
    </div>`;
  popStars();
  if(hasNext){
    document.getElementById('nextMod').addEventListener('click', ()=> renderIntro(mi+1));
  }
  document.getElementById('again').addEventListener('click', ()=> renderMission(mi, 0));
  document.getElementById('home').addEventListener('click', renderHome);
  updateStars();
}

/* =========================================================
   5. ARRANQUE
   ========================================================= */
document.getElementById('btnHome').addEventListener('click', renderHome);
renderHome();
</script>
</body>
</html>
